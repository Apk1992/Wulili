name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Inject GitHub token into embedded.ts
        env:
          WULILI_GH_TOKEN: ${{ secrets.WULILI_GH_TOKEN }}
        run: |
          if [ -z "$WULILI_GH_TOKEN" ]; then
            echo "❌ ERROR: secret WULILI_GH_TOKEN is empty or not set!"
            exit 1
          fi
          echo "Token length: ${#WULILI_GH_TOKEN}"
          sed -i "s|__WULILI_GH_TOKEN__|${WULILI_GH_TOKEN}|g" src/config/embedded.ts

      - name: Verify token injected
        run: |
          if grep -q "__WULILI_GH_TOKEN__" src/config/embedded.ts; then
            echo "❌ ERROR: placeholder still present after sed!"
            echo "--- embedded.ts content: ---"
            cat src/config/embedded.ts
            exit 1
          fi
          echo "✅ Token injected successfully"
          echo "--- embedded.ts head: ---"
          head -c 80 src/config/embedded.ts
          echo ""

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Show APK info
        run: |
          ls -lh android/app/build/outputs/apk/release/
          echo "Release APK built successfully"
