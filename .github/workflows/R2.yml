name: Generate R2 Manifest

on:
  workflow_dispatch:  # 允许手动点按钮运行
  push:
    branches:
      - main

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq + pip
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-pip
          pip3 install --break-system-packages awscli

      - name: Generate manifest.json from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          echo "📦 Listing all files in R2 bucket..."
          aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET_NAME" \
            --endpoint-url "$R2_ENDPOINT" \
            --output json > raw_list.json

          echo "🔨 Building manifest.json..."
          jq '{ files: [.Contents // [] | .[] | {path: .Key, size: .Size, updatedAt: .LastModified}] }' raw_list.json > manifest.json

          echo "📄 Generated manifest preview:"
          head -c 1000 manifest.json
          echo ""

          echo "☁️ Uploading manifest.json to R2 root..."
          aws s3 cp manifest.json "s3://$R2_BUCKET_NAME/manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache, max-age=0"

          echo "✅ Done!"
          echo "🌐 Check: https://pub-daee64ddf4df4b6e8f58100ed89fd6d2.r2.dev/manifest.json"
